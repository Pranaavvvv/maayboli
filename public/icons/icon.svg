<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="#8f4d27"/>

  <!-- Subtle gradient overlay for depth -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <!-- Devanagari letter म (Ma) - large and centered -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Noto Sans Devanagari', 'Mangal', 'Devanagari MT', sans-serif"
    font-size="280"
    font-weight="700"
    fill="#ffffff"
  >म</text>

  <!-- Speech bubble / sound wave accent (top-right) -->
  <g transform="translate(380, 110)" opacity="0.9">
    <!-- Sound wave arcs -->
    <path d="M0 0 A12 12 0 0 1 0 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -6 A20 20 0 0 1 10 30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 -12 A28 28 0 0 1 20 36" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
